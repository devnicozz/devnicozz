<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset=".58" stop-color="#080808"/>
      <stop offset="1" stop-color="#0D0708"/>
    </linearGradient>
    <linearGradient id="fadeRed" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E11D2E" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E11D2E" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" stroke="#262626"/>

  <g clip-path="url(#clip)">
    <g stroke="#FFFFFF" opacity=".045">
      <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200"/>
      <path d="M120 0V320M240 0V320M360 0V320M480 0V320M600 0V320M720 0V320M840 0V320M960 0V320M1080 0V320"/>
    </g>

    <rect x="-360" y="0" width="360" height="320" fill="url(#fadeRed)" opacity=".08">
      <animate attributeName="x" values="-360;1200" dur="2.8s" repeatCount="indefinite"/>
    </rect>

    <g opacity=".8">
      <rect x="-250" y="24" width="180" height="2" rx="1" fill="#E11D2E">
        <animate attributeName="x" values="-250;1250" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1250" y="292" width="250" height="2" rx="1" fill="#7F111A">
        <animate attributeName="x" values="1250;-300" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <circle cx="1090" cy="80" r="115" fill="#E11D2E" opacity=".045" filter="url(#soft)">
      <animate attributeName="opacity" values=".025;.065;.025" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0" y="0" width="6" height="320" rx="3" fill="#E11D2E"/>

  <text x="54" y="54" fill="#767676" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.2">DEVNICOZZ / PROFILE 2026</text>

  <text x="54" y="133" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="800" letter-spacing="-2.2">NICOLAS</text>
  <text x="54" y="176" fill="#E11D2E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700">WEB DEVELOPER</text>

  <text x="54" y="224" fill="#C8C8C8" font-family="Arial, Helvetica, sans-serif" font-size="17">Técnico em Informática para Internet</text>
  <text x="54" y="255" fill="#858585" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1">CODE  /  DESIGN  /  BUILD  /  IMPROVE</text>

  <g transform="translate(788 57)">
    <text x="0" y="0" fill="#666666" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">CURRENT STACK</text>
    <line x1="0" y1="17" x2="340" y2="17" stroke="#242424"/>

    <text x="0" y="55" fill="#F0F0F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">HTML</text>
    <text x="106" y="55" fill="#F0F0F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">CSS</text>
    <text x="194" y="55" fill="#F0F0F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">JAVASCRIPT</text>

    <text x="0" y="98" fill="#666666" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">FOCUS</text>
    <line x1="0" y1="115" x2="340" y2="115" stroke="#242424"/>

    <text x="0" y="151" fill="#D7D7D7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">interfaces / systems / mobile</text>

    <g transform="translate(0 178)">
      <circle cx="5" cy="5" r="5" fill="#E11D2E">
        <animate attributeName="opacity" values=".35;1;.35" dur=".9s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="10" fill="#A7A7A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">BUILDING SOMETHING NEW</text>
      <rect x="195" y="-2" width="8" height="15" fill="#E11D2E">
        <animate attributeName="opacity" values="1;0;1" dur=".62s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(1015 18)">
    <rect width="125" height="28" rx="14" fill="#100607" stroke="#431017"/>
    <circle cx="18" cy="14" r="4" fill="#E11D2E">
      <animate attributeName="r" values="3;5;3" dur=".9s" repeatCount="indefinite"/>
    </circle>
    <text x="31" y="18.5" fill="#EAEAEA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">ACTIVE BUILD</text>
  </g>
</svg>